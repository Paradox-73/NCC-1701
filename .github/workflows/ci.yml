# CI: every pull request and every push to main runs the tests, builds the client the way Vercel does and builds the
# server image the way Render does. Render deploys main only after these checks pass (autoDeployTrigger: checksPass
# in render.yaml); Vercel builds a preview for every pull request and production from main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w client
        env:
          VITE_API_URL: https://example.invalid
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t ncc1701-server .
